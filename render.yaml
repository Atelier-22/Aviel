# Render blueprint — provisions the Astraeya API service, its voice server and
# its Postgres database.
#
# To use: Render Dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file, creates both resources, and wires DATABASE_URL between them.
# ANTHROPIC_API_KEY is marked sync:false, so Render prompts you for it rather
# than expecting it to live in the repo.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE RE-APPLYING THIS BLUEPRINT TO AN EXISTING DEPLOYMENT
# ---------------------------------------------------------------------------
#
# Every name below was changed when the project was renamed to Astraeya (it was
# renamed once before, too). Render matches existing
# resources by name, so applying this file to a deployment created under the old
# names does not rename anything — it provisions NEW resources beside the old
# ones, and the new API points at a NEW EMPTY DATABASE. Existing accounts,
# conversations and settings would still exist, but the running service would no
# longer be able to see them.
#
# What can and cannot be renamed on a live Render deployment:
#
#   service name (astraeya-api)   CAN be renamed, in the service's own Settings.
#                              Do that first so this file matches it.
#   disk name (astraeya-models)   CAN be renamed in the service's Disks settings.
#   database name (astraeya-db)   CAN be renamed — it is only Render's label.
#   databaseName / user        CANNOT. Both are fixed inside Postgres when the
#                              instance is created. Renaming them here has no
#                              effect on a live database, and re-applying the
#                              blueprint is what triggers the empty-database
#                              outcome described above.
#
# These three stay lowercase deliberately, and are the only names in the project
# that do. Postgres folds an unquoted identifier to lowercase, so writing
# "Astraeya" here would produce a database called "astraeya" anyway — the capital
# would be a claim the database does not honour rather than a rename.
#
# If the internal database name and role genuinely have to become "astraeya",
# that is a data migration, not a config change:
#
#   pg_dump  "$OLD_DATABASE_URL" -Fc -f astraeya.dump
#   # create the new database and role on the new instance, then:
#   pg_restore -d "$NEW_DATABASE_URL" --no-owner --role=astraeya astraeya.dump
#
# Verify row counts on both sides before pointing the service at the new URL,
# and keep the old instance until you have.
#
# The safe path, if none of that is wanted: rename the service, the disk and the
# database label in the dashboard to match this file, and leave databaseName and
# user as they are. They appear only inside the connection string and are never
# shown to a user.

services:
  - type: web
    name: astraeya-api
    runtime: node
    plan: free
    region: oregon
    rootDir: astraeya-api
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, which is where TypeScript lives. Without it the build has
    # no compiler and falls back to whatever tsc it can find.
    #
    # download-model.js runs before the compile so the offline fallback model is
    # on the persistent disk by the time the service boots. It skips the
    # download when the file is already there, so a redeploy costs nothing, and
    # it exits 0 on failure rather than taking the whole build down.
    buildCommand: npm ci --include=dev && node scripts/download-model.js && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Renders' filesystem is wiped on every deploy, so the ~2 GB gguf lives on a
    # disk instead. Note that disks require a paid instance type — on the free
    # plan this block has to go, and the model is re-downloaded each deploy.
    disk:
      name: astraeya-models
      mountPath: /models
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: astraeya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: LOCAL_MODEL_DIR
        value: /models
      # Set these two in the Render dashboard after the first deploy:
      #   ANTHROPIC_API_KEY — your key from console.anthropic.com
      #   CORS_ORIGINS      — your Vercel URL, e.g. https://astraeya.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
      # Image, logo and AI video generation. Optional; see .env.example.
      - key: FAL_KEY
        sync: false
      # This service's own public URL, for the "video ready" webhook. Optional.
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # The voice server below, reached over Render's private network.
      - key: VOICE_SERVICE_URL
        fromService:
          type: pserv
          name: astraeya-voice
          property: hostport
      - key: VOICE_SECRET
        fromService:
          type: pserv
          name: astraeya-voice
          envVarKey: VOICE_SECRET

  # Astraeya's voice: Kokoro and Piper, on the CPU. A private service, so it
  # has no public URL and only the API can reach it; and a separate one, so a
  # crash or a slow sentence here never takes chat down.
  #
  # Standard (2 GB RAM, 1 CPU) is the smallest plan that fits: Kokoro needs
  # about 1 GB once loaded, each Piper voice about 150 MB. On one CPU Kokoro
  # takes a few seconds per sentence, so live mode automatically uses the fast
  # Piper voices (Kristin / John) while read-aloud keeps the chosen voice.
  #
  # The ~1 GB of models is downloaded during the build and checked against the
  # SHA-256 in models.json; a mismatch fails the build rather than starting on
  # a model nobody tested.
  - type: pserv
    name: astraeya-voice
    runtime: python
    plan: standard
    region: oregon
    rootDir: astraeya-voice
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: HOST
        value: 0.0.0.0
      - key: VOICE_MODELS_DIR
        value: ./models
      - key: VOICE_THREADS
        value: "1"
      - key: VOICE_SECRET
        generateValue: true

databases:
  - name: astraeya-db
    plan: free
    region: oregon
    databaseName: astraeya
    user: astraeya
